
name: Build Radio Dewi Anjani APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Flutter source
        run: |
          unzip -o Radio_Dewi_Anjani_01.zip -d .
          test -f pubspec.yaml
          test -f lib/main.dart
          test -f assets/logo_radio.jpg

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --project-name radio_dewi_anjani --org id.radiodewianjani --platforms=android .

      - name: Install dependencies
        run: flutter pub get

      - name: Generate app icon
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Radio-Dewi-Anjani-APK
          path: build/app/outputs/flutter-apk/app-release.apk

