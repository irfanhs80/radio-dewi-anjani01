
name: Build Radio Dewi Anjani Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Flutter source
        run: |
          unzip -o Radio_Dewi_Anjani_01.zip -d .
          test -f pubspec.yaml
          test -f lib/main.dart
          test -f assets/logo_radio.jpg

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          flutter create \
            --project-name radio_dewi_anjani \
            --org id.radiodewianjani \
            --platforms=android .

      - name: Enable internet permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permission = '<uses-permission android:name="android.permission.INTERNET" />'
          if "android.permission.INTERNET" not in s:
              s = s.replace("<application", permission + "\n    <application", 1)
              p.write_text(s)
          PY

      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p android/app
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode \
            > android/app/upload-keystore.jks
          test -s android/app/upload-keystore.jks

      - name: Configure Android signing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys

          kts = Path("android/app/build.gradle.kts")
          groovy = Path("android/app/build.gradle")

          if kts.exists():
              p = kts
              s = p.read_text()
              marker = "    buildTypes {"

              signing = '''    signingConfigs {
                  create("release") {
                      keyAlias = System.getenv("KEY_ALIAS")
                      keyPassword = System.getenv("KEY_PASSWORD")
                      storeFile = file("upload-keystore.jks")
                      storePassword = System.getenv("KEYSTORE_PASSWORD")
                  }
              }

          '''

              if "signingConfigs {" not in s:
                  if marker not in s:
                      sys.exit("buildTypes block not found")
                  s = s.replace(marker, signing + marker, 1)

              debug = 'signingConfig = signingConfigs.getByName("debug")'
              release = 'signingConfig = signingConfigs.getByName("release")'

              if debug in s:
                  s = s.replace(debug, release, 1)

              if release not in s:
                  sys.exit("Release signing configuration not found")

          elif groovy.exists():
              p = groovy
              s = p.read_text()
              marker = "    buildTypes {"

              signing = '''    signingConfigs {
                  release {
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                      storeFile file("upload-keystore.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                  }
              }

          '''

              if "signingConfigs {" not in s:
                  if marker not in s:
                      sys.exit("buildTypes block not found")
                  s = s.replace(marker, signing + marker, 1)

              s = s.replace(
                  "signingConfig signingConfigs.debug",
                  "signingConfig signingConfigs.release"
              )
              s = s.replace(
                  "signingConfig = signingConfigs.debug",
                  "signingConfig = signingConfigs.release"
              )

              if "signingConfigs.release" not in s:
                  sys.exit("Release signing configuration not found")
          else:
              sys.exit("Android app Gradle file not found")

          p.write_text(s)
          print("Android release signing configured.")
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Generate app icon
        run: dart run flutter_launcher_icons

      - name: Build signed APK and AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build apk --release
          flutter build appbundle --release

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: Radio-Dewi-Anjani-Release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
