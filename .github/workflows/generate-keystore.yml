
name: Generate Radio Dewi Anjani Keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install 7zip
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Generate Android Keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -e

          mkdir -p output

          keytool -genkeypair -v \
            -keystore radio-dewi-anjani-upload.jks \
            -storetype JKS \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEYSTORE_PASSWORD" \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Radio Dewi Anjani, OU=Mobile, O=Radio Dewi Anjani, L=Anjani, ST=Nusa Tenggara Barat, C=ID"

          mv radio-dewi-anjani-upload.jks output/

      - name: Encrypt Keystore Archive
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          7z a -t7z -mhe=on \
            "-p${KEYSTORE_PASSWORD}" \
            output/radio-dewi-anjani-keystore.7z \
            output/radio-dewi-anjani-upload.jks

          rm -f output/radio-dewi-anjani-upload.jks

      - name: Upload Encrypted Keystore
        uses: actions/upload-artifact@v4
        with:
          name: Radio-Dewi-Anjani-Keystore
          path: output/radio-dewi-anjani-keystore.7z
          retention-days: 7
